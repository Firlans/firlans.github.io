name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - features
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout my-monorepo ke workspace root
      #    Jika repo private, tambahkan: token: ${{ secrets.MONOREPO_TOKEN }}
      - name: Checkout monorepo (packages & workspace config)
        uses: actions/checkout@v4
        with:
          repository: Firlans/my-monorepo
          path: .

      # 2. Checkout app terbaru (branch features) ke apps/firlans.github.io/
      - name: Checkout app (firlans.github.io)
        uses: actions/checkout@v4
        with:
          ref: features
          path: apps/firlans.github.io

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build @packages/components (CSS)
        run: pnpm --filter @packages/components build:css

      - name: Build app
        run: pnpm --filter my-portofolio build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # 3. Push hasil build ke branch main → GitHub Pages serve dari sana
      - name: Push dist to main branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/firlans.github.io/dist
          publish_branch: main
          force_orphan: true
